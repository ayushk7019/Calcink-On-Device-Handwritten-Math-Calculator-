<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>CalcInk</title>
  </head>

  <body>
    <div id="app">
      <div id="toolbar">
        <button id="undo">Undo</button>
        <button id="redo">Redo</button>
        <button id="clear">Clear</button>

        <label for="width">
          Width
          <input
            id="width"
            type="range"
            min="1"
            max="12"
            value="3"
          />
        </label>

        <button id="recognize">Recognize</button>

        <span id="prediction">Model loading...</span>
      </div>

      <canvas id="canvas"></canvas>
    </div>

    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
