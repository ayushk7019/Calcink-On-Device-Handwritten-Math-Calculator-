<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>CalcInk</title>
  </head>

  <body>
    <div id="app">
      <div id="toolbar">
        <button
          id="pen"
          type="button"
          aria-pressed="true"
        >
          Pen
        </button>

        <button
          id="eraser"
          type="button"
          aria-pressed="false"
        >
          Eraser
        </button>

        <button
          id="undo"
          type="button"
        >
          Undo
        </button>

        <button
          id="redo"
          type="button"
        >
          Redo
        </button>

        <button
          id="clear"
          type="button"
        >
          Clear
        </button>

        <label for="width">
          Width
          <input
            id="width"
            type="range"
            min="1"
            max="12"
            value="3"
          />
        </label>

        <span id="prediction">
          Model loading...
        </span>
      </div>

      <canvas id="canvas"></canvas>
    </div>

    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
